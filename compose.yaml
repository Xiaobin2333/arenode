name: arenode

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cdnfly_reseller
      POSTGRES_USER: cdnfly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdnfly -d cdnfly_reseller"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: ${ARENODE_IMAGE:-arenode:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://cdnfly:${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}@postgres:5432/cdnfly_reseller
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${ARENODE_BIND_ADDRESS:-127.0.0.1}:${PORT:-3080}:3080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-arenode-postgres-data}
    external: ${ARENODE_EXTERNAL_VOLUMES:-false}
  redis-data:
    name: ${REDIS_VOLUME_NAME:-arenode-redis-data}
    external: ${ARENODE_EXTERNAL_VOLUMES:-false}
